<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asas Financials Login</title>
    <link rel="icon" type="image/png" href="/assets/logo-dark.png" />
    <style>
      :root {
        --bg: #f3f6fa;
        --card: #ffffff;
        --line: #dce6f2;
        --text: #1b2b40;
        --muted: #667b95;
        --accent: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 12% 15%, #ffffff 0%, #f3f6fa 40%, #eef2f8 100%);
        color: var(--text);
        font-family: "Roboto", "Segoe UI", sans-serif;
        padding: 16px;
      }

      .auth-card {
        width: min(420px, 100%);
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 12px 28px rgba(18, 36, 60, 0.08);
        padding: 24px;
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }

      .brand img {
        width: 240px;
        max-width: 100%;
        height: auto;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      form {
        display: grid;
        gap: 10px;
      }

      label {
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }

      input {
        width: 100%;
        height: 40px;
        border: 1px solid #cad8e8;
        border-radius: 8px;
        padding: 0 12px;
        font-size: 14px;
        color: var(--text);
      }

      button {
        margin-top: 8px;
        height: 40px;
        border: 1px solid #da8a04;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
      }

      #status {
        margin-top: 10px;
        min-height: 18px;
        color: #b33d3d;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <section class="auth-card">
      <div class="brand">
        <img src="/assets/logo-dark.png" alt="Asas Financials" />
        <p>Sign in to continue to the dashboard</p>
      </div>

      <form id="loginForm">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div>
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit">Sign In</button>
      </form>
      <div id="status"></div>
    </section>

    <script>
      function setStatus(text) {
        document.getElementById("status").innerText = text;
      }

      async function validateSession(token) {
        const res = await fetch("/auth/me", {
          headers: { Authorization: `Bearer ${token}` },
        });
        return res.ok;
      }

      async function bootstrap() {
        const token = localStorage.getItem("auth_token");
        if (!token) return;

        try {
          const valid = await validateSession(token);
          if (valid) {
            window.location.href = "/dashboard";
            return;
          }
        } catch (error) {
          // no-op
        }

        localStorage.removeItem("auth_token");
      }

      document.getElementById("loginForm").addEventListener("submit", async event => {
        event.preventDefault();
        setStatus("");

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          if (!res.ok) {
            setStatus("Invalid credentials");
            return;
          }

          const data = await res.json();
          localStorage.setItem("auth_token", data.access_token);
          window.location.href = "/dashboard";
        } catch (error) {
          setStatus("Unable to login right now");
        }
      });

      bootstrap();
    </script>
  </body>
</html>
