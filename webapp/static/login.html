<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asas — Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .logo-mark {
      width: 52px; height: 52px;
      background: #1F4E78;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 22px; color: #fff; letter-spacing: -0.5px;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 20px; font-weight: 700; color: #1F4E78;
      margin-bottom: 6px;
    }
    .brand span { font-weight: 400; color: #718096; }

    .tagline {
      font-size: 13px; color: #a0aec0; margin-bottom: 32px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 20px rgba(0,0,0,.08);
      width: 100%;
      max-width: 380px;
      padding: 36px 32px;
    }

    .card-title {
      font-size: 18px; font-weight: 700; color: #1a202c;
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 12px; font-weight: 700;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 9px;
      font-size: 14px;
      color: #1a202c;
      background: #f7fafc;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: #1F4E78; background: #fff; }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: #1F4E78;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s;
      margin-top: 4px;
    }
    .btn:hover { background: #174069; }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 10px 14px;
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      color: #c53030;
      font-size: 13px;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>

  <div class="logo-mark">AF</div>
  <div class="brand">Asas <span>Financial Extractor</span></div>
  <div class="tagline">Authorized access only</div>

  <div class="card">
    <div class="card-title">Sign in</div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button class="btn" type="submit">Sign in</button>
    </form>

    <div class="error-msg" id="errMsg">Incorrect username or password.</div>
  </div>

  <script>
    const form   = document.getElementById('loginForm');
    const errMsg = document.getElementById('errMsg');

    // Pre-fill error from URL param if server redirected with ?error=1
    if (new URLSearchParams(location.search).get('error')) {
      errMsg.classList.add('show');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      errMsg.classList.remove('show');

      const body = new URLSearchParams({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      });

      const res = await fetch('/login', { method: 'POST', body });
      if (res.redirected) {
        window.location.href = res.url;
      } else if (!res.ok) {
        errMsg.classList.add('show');
      } else {
        window.location.href = '/';
      }
    });
  </script>
</body>
</html>
